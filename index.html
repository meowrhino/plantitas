<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Herbario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f6f2;
            --bg-card: #faf8f5;
            --text: #1a1a1a;
            --text-muted: #8a7e74;
            --text-light: #a09585;
            --border: #e5e0d8;
            --border-light: #ede8e0;
            --accent: #7a8a5e;
            --accent-light: #e8eddf;
            --danger: #c0564f;
            --danger-light: #fce8e8;
            --caution: #c4a97d;
            --caution-light: #fef3e2;
            --purple: #8b6b9e;
            --purple-light: #f0e5f5;
            --radius: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ======== HERO (editorial style) ======== */
        .hero {
            padding: 72px 48px 0;
            max-width: 1200px;
            margin: 0 auto;
        }
        .hero-label {
            font-size: 0.68em;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-light);
            font-weight: 500;
            margin-bottom: 16px;
        }
        .hero h1 {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(3.5em, 8vw, 6em);
            font-weight: 400;
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
        }
        .hero h1 em {
            font-style: italic;
            color: var(--accent);
        }
        .hero-desc {
            font-size: 1em;
            color: var(--text-muted);
            max-width: 420px;
            line-height: 1.6;
            font-weight: 300;
        }

        /* ======== META BAR ======== */
        .meta-bar {
            display: flex;
            gap: 48px;
            padding: 28px 48px;
            max-width: 1200px;
            margin: 32px auto 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .meta-num {
            font-family: 'Instrument Serif', serif;
            font-size: 2.4em;
            line-height: 1;
        }
        .meta-label {
            font-size: 0.68em;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-light);
            font-weight: 500;
            margin-top: 4px;
        }

        /* ======== SEARCH + FILTERS ======== */
        .controls {
            max-width: 1200px;
            margin: 28px auto 0;
            padding: 0 48px;
        }

        .search-bar {
            position: relative;
            margin-bottom: 20px;
        }
        .search-bar input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-card);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92em;
            color: var(--text);
            outline: none;
            transition: border-color 0.3s;
        }
        .search-bar input::placeholder { color: var(--text-light); }
        .search-bar input:focus { border-color: var(--accent); }
        .search-bar svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        /* Filter: segmented horizontal bar */
        .filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }
        .filter-group {
            display: flex;
            gap: 2px;
            background: var(--border-light);
            border-radius: 8px;
            padding: 3px;
        }
        .filter-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border: none;
            border-radius: 6px;
            background: transparent;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .filter-btn:hover {
            color: var(--text);
            background: rgba(255,255,255,0.5);
        }
        .filter-btn.active {
            background: white;
            color: var(--text);
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .filter-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Category colors */
        .cat-relajante { background: #b8c5e2; }
        .cat-digestiva { background: #e2c87a; }
        .cat-respiratoria { background: #7abfb0; }
        .cat-circulatoria { background: #d4868a; }
        .cat-depurativa { background: #8ab87a; }
        .cat-inmune { background: #b09cd6; }
        .cat-urinaria { background: #7ab5d4; }
        .cat-hormonal { background: #c97ab8; }
        .cat-piel { background: #d4a87a; }
        .cat-general { background: #aaa59c; }
        .cat-especias { background: #c98a5a; }

        /* ======== GRID ======== */
        .grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 48px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        /* ======== CARDS (apothecary style) ======== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(0,0,0,0.06);
            border-color: var(--border);
        }

        /* Colored top line per category */
        .card-top-line {
            height: 3px;
            width: 100%;
        }

        .card-inner {
            padding: 22px 24px 18px;
            position: relative;
        }

        /* Stamp (safety indicator) */
        .card-stamp {
            position: absolute;
            top: 16px;
            right: 18px;
            width: 48px;
            height: 48px;
            border: 2px solid;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transform: rotate(-12deg);
            line-height: 1.15;
            text-align: center;
        }
        .stamp-safe { border-color: var(--accent); color: var(--accent); }
        .stamp-caution { border-color: var(--caution); color: var(--caution); }
        .stamp-danger { border-color: var(--danger); color: var(--danger); }

        .card-category-label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .card-category-label .cat-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .card-category-label span:last-child {
            font-size: 0.68em;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-light);
            font-weight: 500;
        }

        .card h2 {
            font-family: 'Instrument Serif', serif;
            font-size: 1.6em;
            font-weight: 400;
            margin-bottom: 8px;
            color: var(--text);
            padding-right: 56px;
            letter-spacing: -0.01em;
        }
        .card-desc {
            color: var(--text-muted);
            font-size: 0.88em;
            line-height: 1.55;
            margin-bottom: 14px;
            font-weight: 300;
            padding-right: 20px;
        }
        .card-props {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .prop-tag {
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.76em;
            font-weight: 500;
            background: var(--border-light);
            color: #6b5e50;
        }
        .prop-dots { margin-left: 3px; letter-spacing: 1px; }
        .prop-dots .on { color: var(--accent); }
        .prop-dots .off { color: #d4c9ba; }

        .card-footer {
            padding: 10px 24px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-footer-cat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72em;
            color: var(--text-light);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .card-footer-cat .cat-dot-sm {
            width: 6px; height: 6px;
            border-radius: 50%;
        }
        .card-stock {
            font-size: 0.72em;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 5px;
        }
        .stock-have { background: var(--accent-light); color: #5a6b40; }
        .stock-want { background: var(--purple-light); color: var(--purple); }

        /* ======== MODAL ======== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.visible { display: flex; }

        .modal {
            background: var(--bg);
            border-radius: 12px;
            max-width: 580px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease-out;
            position: relative;
        }
        @keyframes modalIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-close {
            position: sticky;
            top: 12px;
            float: right;
            margin-right: 16px;
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            font-size: 1.1em;
            cursor: pointer;
            z-index: 10;
            transition: background 0.2s;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover { background: var(--border-light); }

        .modal-top-line { height: 4px; border-radius: 12px 12px 0 0; }

        .modal-header {
            padding: 28px 28px 0;
        }
        .modal-category-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .modal-cat-dot { width: 9px; height: 9px; border-radius: 50%; }
        .modal-cat-label {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-light);
            font-weight: 500;
        }
        .modal-header h2 {
            font-family: 'Instrument Serif', serif;
            font-size: 2.2em;
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }
        .modal-badges {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .modal-badge {
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 0.72em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .mbadge-safe { background: var(--accent-light); color: #5a6b40; }
        .mbadge-caution { background: var(--caution-light); color: #a67c37; }
        .mbadge-danger { background: var(--danger-light); color: var(--danger); }
        .mbadge-have { background: var(--accent-light); color: #5a6b40; }
        .mbadge-want { background: var(--purple-light); color: var(--purple); }

        .modal-section {
            padding: 20px 28px 0;
        }
        .modal-section:last-child { padding-bottom: 28px; }

        .modal-section-title {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-light);
        }
        .modal-section p {
            font-size: 0.92em;
            color: var(--text-muted);
            line-height: 1.65;
            font-weight: 300;
        }

        .modal-props-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .modal-prop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border-light);
        }
        .modal-prop-name {
            font-size: 0.88em;
            font-weight: 500;
            color: var(--text);
        }
        .modal-prop-dots {
            display: flex;
            gap: 4px;
        }
        .modal-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--border-light);
        }
        .modal-dot.filled { background: var(--accent); }

        .modal-safety-box {
            padding: 14px 16px;
            border-radius: 8px;
            border-left: 3px solid;
            font-size: 0.9em;
            line-height: 1.55;
            font-weight: 400;
        }
        .safety-safe { background: var(--accent-light); border-color: var(--accent); color: #4a5a36; }
        .safety-caution { background: var(--caution-light); border-color: var(--caution); color: #7a6030; }
        .safety-danger { background: var(--danger-light); border-color: var(--danger); color: #8a3a36; }

        .modal-list {
            list-style: none;
            padding: 0;
        }
        .modal-list li {
            font-size: 0.88em;
            color: var(--text-muted);
            line-height: 1.55;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-light);
            font-weight: 300;
        }
        .modal-list li:last-child { border-bottom: none; }
        .modal-list li::before {
            content: '';
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--text-light);
            margin-right: 10px;
            vertical-align: middle;
        }

        .modal-prep-box {
            padding: 14px 16px;
            border-radius: 8px;
            background: #f0f5f2;
            border-left: 3px solid var(--accent);
            font-size: 0.9em;
            color: #4a5a36;
            line-height: 1.55;
            font-weight: 300;
        }

        .modal-reco-box {
            padding: 14px 16px;
            border-radius: 8px;
            background: var(--purple-light);
            border-left: 3px solid var(--purple);
            margin-top: 4px;
        }
        .modal-reco-box strong {
            font-size: 0.78em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--purple);
            display: block;
            margin-bottom: 4px;
        }
        .modal-reco-box p {
            color: #6a4a7a !important;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-light);
        }
        .no-results h3 {
            font-family: 'Instrument Serif', serif;
            font-size: 1.6em;
            font-weight: 400;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        /* ======== RESPONSIVE ======== */
        @media (max-width: 768px) {
            .hero, .meta-bar, .controls, .grid { padding-left: 20px; padding-right: 20px; }
            .hero { padding-top: 48px; }
            .grid { grid-template-columns: 1fr; }
            .meta-bar { gap: 24px; flex-wrap: wrap; }
            .filter-group { flex-wrap: wrap; }
            .modal-header, .modal-section { padding-left: 20px; padding-right: 20px; }
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="hero-label">Guía de plantas medicinales</div>
    <h1>El<br><em>Herbario</em></h1>
    <p class="hero-desc">Infusiones, remedios y autocuidado. Con info de seguridad real para que nadie la líe.</p>
</div>

<div class="meta-bar" id="meta-bar"></div>

<div class="controls">
    <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="Buscar planta, propiedad, efecto...">
    </div>
    <div class="filter-bar" id="filter-bar"></div>
</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal"></div>
</div>

<script>

    general:      { label: "General",       color: "#8a857c", dot: "cat-general" }
};

const plantas = [
    // ===== TENEMOS =====
    {

        descripcion: "Diurético y regenerador de tejidos. Rica en sílice para uñas, pelo y huesos.",

    {

    {

    {

// ====== STATE ======
let filtroCategoria = null;
let filtroPeligrosidad = null;
let filtroStock = null;
let searchText = "";

function filtrar() {
    return plantas.filter(p => {
        if (filtroCategoria && p.categoria !== filtroCategoria) return false;
        if (filtroPeligrosidad && p.peligrosidad !== filtroPeligrosidad) return false;
        if (filtroStock === "have" && !p.tenemos) return false;
        if (filtroStock === "want" && p.tenemos) return false;
        if (searchText) {
            const s = searchText.toLowerCase();
            return p.nombre.toLowerCase().includes(s)
                || p.descripcion.toLowerCase().includes(s)
                || p.propiedades.some(pr => pr.nombre.toLowerCase().includes(s))
                || p.contraindicaciones.some(c => c.toLowerCase().includes(s));
        }
        return true;
    });
}

// ====== RENDER ======
function renderMeta() {
    const t = plantas.length;
    const h = plantas.filter(p => p.tenemos).length;
    const peligro = plantas.filter(p => p.peligrosidad === "alta").length;
    document.getElementById("meta-bar").innerHTML = `
        <div><div class="meta-num">${t}</div><div class="meta-label">Plantas</div></div>
        <div><div class="meta-num">${h}</div><div class="meta-label">En stock</div></div>
        <div><div class="meta-num">${t - h}</div><div class="meta-label">Por comprar</div></div>
        <div><div class="meta-num">${peligro}</div><div class="meta-label">Peligro alto</div></div>
    `;
}

function renderFilters() {
    // Category group
    const cats = [...new Set(plantas.map(p => p.categoria))];
    let catBtns = `<button class="filter-btn ${!filtroCategoria ? 'active' : ''}" onclick="setCategoria(null)">Todas</button>`;
    cats.forEach(c => {
        const info = categorias[c];
        catBtns += `<button class="filter-btn ${filtroCategoria === c ? 'active' : ''}" onclick="setCategoria('${c}')">
            <span class="filter-dot ${info.dot}"></span>${info.label}
        </button>`;
    });

    // Safety + stock group
    let statusBtns = `
        <button class="filter-btn ${filtroPeligrosidad === 'alta' ? 'active' : ''}" onclick="setPeligro('alta')">
            <span class="filter-dot" style="background:var(--danger)"></span>Peligro alto
        </button>
        <button class="filter-btn ${filtroPeligrosidad === 'media' ? 'active' : ''}" onclick="setPeligro('media')">
            <span class="filter-dot" style="background:var(--caution)"></span>Precaución
        </button>
    `;

    let stockBtns = `
        <button class="filter-btn ${filtroStock === 'have' ? 'active' : ''}" onclick="setStock('have')">En stock</button>
        <button class="filter-btn ${filtroStock === 'want' ? 'active' : ''}" onclick="setStock('want')">Por comprar</button>
    `;

    document.getElementById("filter-bar").innerHTML = `
        <div class="filter-group">${catBtns}</div>
        <div class="filter-group">${statusBtns}</div>
        <div class="filter-group">${stockBtns}</div>
    `;
}

function renderGrid() {
    const list = filtrar();
    const grid = document.getElementById("grid");

    if (!list.length) {
        grid.innerHTML = `<div class="no-results"><h3>Sin resultados</h3><p>Prueba otra combinación de filtros.</p></div>`;
        return;
    }

    grid.innerHTML = list.map(p => {
        const cat = categorias[p.categoria];
        const stampClass = p.peligrosidad === "alta" ? "stamp-danger" : p.peligrosidad === "media" ? "stamp-caution" : "stamp-safe";
        const stampText = p.peligrosidad === "alta" ? "peligro<br>alto" : p.peligrosidad === "media" ? "precau-<br>ción" : "segura";
        const stockClass = p.tenemos ? "stock-have" : "stock-want";
        const stockText = p.tenemos ? "En stock" : "Por comprar";

        return `
        <div class="card" onclick="openModal('${p.nombre.replace(/'/g, "\\'")}')">
            <div class="card-top-line" style="background:${cat.color}"></div>
            <div class="card-inner">
                <div class="card-stamp ${stampClass}">${stampText}</div>
                <div class="card-category-label">
                    <span class="cat-dot" style="background:${cat.color}"></span>
                    <span>${cat.label}</span>
                </div>
                <h2>${p.nombre}</h2>
                <p class="card-desc">${p.descripcion}</p>
                <div class="card-props">
                    ${p.propiedades.map(pr =>
                        `<span class="prop-tag">${pr.nombre} <span class="prop-dots"><span class="on">${'+'.repeat(pr.intensidad)}</span><span class="off">${'.'.repeat(3-pr.intensidad)}</span></span></span>`
                    ).join('')}
                </div>
            </div>
            <div class="card-footer">
                <span class="card-footer-cat">
                    <span class="cat-dot-sm" style="background:${cat.color}"></span>
                    ${cat.label}
                </span>
                <span class="card-stock ${stockClass}">${stockText}</span>
            </div>
        </div>`;
    }).join('');
}

function renderAll() { renderMeta(); renderFilters(); renderGrid(); }

function setCategoria(c) { filtroCategoria = filtroCategoria === c ? null : c; renderAll(); }
function setPeligro(p) { filtroPeligrosidad = filtroPeligrosidad === p ? null : p; renderAll(); }
function setStock(s) { filtroStock = filtroStock === s ? null : s; renderAll(); }

document.getElementById("search").addEventListener("input", e => {
    searchText = e.target.value;
    renderGrid();
});

// ====== MODAL ======
function openModal(nombre) {
    const p = plantas.find(pl => pl.nombre === nombre);
    if (!p) return;
    const cat = categorias[p.categoria];
    const safetyClass = p.peligrosidad === "alta" ? "safety-danger" : p.peligrosidad === "media" ? "safety-caution" : "safety-safe";
    const safetyBadge = p.peligrosidad === "alta" ? "mbadge-danger" : p.peligrosidad === "media" ? "mbadge-caution" : "mbadge-safe";
    const safetyLabel = p.peligrosidad === "alta" ? "Peligro alto" : p.peligrosidad === "media" ? "Precaución" : "Segura";

    document.getElementById("modal").innerHTML = `
        <button class="modal-close" onclick="closeModal()">×</button>
        <div class="modal-top-line" style="background:${cat.color}"></div>
        <div class="modal-header">
            <div class="modal-category-bar">
                <span class="modal-cat-dot" style="background:${cat.color}"></span>
                <span class="modal-cat-label">${cat.label}</span>
            </div>
            <h2>${p.nombre}</h2>
            <div class="modal-badges">
                <span class="modal-badge ${safetyBadge}">${safetyLabel}</span>
                <span class="modal-badge ${p.tenemos ? 'mbadge-have' : 'mbadge-want'}">${p.tenemos ? 'En stock' : 'Por comprar'}</span>
            </div>
        </div>

        <div class="modal-section">
            <div class="modal-section-title">Descripción</div>
            <p>${p.descripcion}</p>
        </div>

        <div class="modal-section">
            <div class="modal-section-title">Propiedades</div>
            <div class="modal-props-list">
                ${p.propiedades.map(pr => `
                    <div class="modal-prop-row">
                        <span class="modal-prop-name">${pr.nombre}</span>
                        <div class="modal-prop-dots">
                            ${[1,2,3].map(i => `<div class="modal-dot ${i <= pr.intensidad ? 'filled' : ''}"></div>`).join('')}
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>

        <div class="modal-section">
            <div class="modal-section-title">Seguridad</div>
            <div class="modal-safety-box ${safetyClass}">${p.seguridad}</div>
        </div>

        <div class="modal-section">
            <div class="modal-section-title">Contraindicaciones</div>
            <ul class="modal-list">
                ${p.contraindicaciones.map(c => `<li>${c}</li>`).join('')}
            </ul>
        </div>

        <div class="modal-section">
            <div class="modal-section-title">Preparación</div>
            <div class="modal-prep-box">${p.preparacion}</div>
        </div>

        ${p.recomendacion && !p.tenemos ? `
        <div class="modal-section">
            <div class="modal-reco-box">
                <strong>Por qué tenerla</strong>
                <p>${p.recomendacion}</p>
            </div>
        </div>` : ''}
    `;

    document.getElementById("modal-overlay").classList.add("visible");
    document.body.style.overflow = "hidden";
}

function closeModal() {
    document.getElementById("modal-overlay").classList.remove("visible");
    document.body.style.overflow = "";
}

document.getElementById("modal-overlay").addEventListener("click", e => {
    if (e.target.id === "modal-overlay") closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

// Init
renderAll();
</script>
</body>
</html>
