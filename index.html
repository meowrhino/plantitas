<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Herbario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="hero">
    <div class="hero-label">Guia de plantas medicinales</div>
    <h1>El<br><em>Herbario</em></h1>
    <p class="hero-desc">Infusiones, remedios y autocuidado. Con info de seguridad real para que nadie la lie.</p>
</div>

<div class="meta-bar" id="meta-bar"></div>

<div class="controls">
    <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="Buscar planta, propiedad, efecto...">
    </div>
    <div class="filter-bar" id="filter-bar"></div>
</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
